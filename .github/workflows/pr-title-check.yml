name: PR title convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qE '^PR-[0-9]{3}: (feat|fix|test|docs|refactor|chore|perf): .+$'; then
            echo "OK: título segue o padrão PR-###: <tipo>: <descricao>"
          else
            echo "::error::Título do PR deve seguir o padrão 'PR-###: <tipo>: <descricao>' (ex.: PR-001: feat: adicionar autenticação JWT). Veja docs/PADRAO-PR.md."
            exit 1
          fi

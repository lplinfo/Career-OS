name: PR registry - mark merged

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-registry
  cancel-in-progress: false

jobs:
  mark-merged:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'auto/pr-registry/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract PR-### from title
        id: num
        run: |
          num=$(echo "${{ github.event.pull_request.title }}" | grep -oE 'PR-[0-9]{3}' | head -n1 || true)
          echo "num=${num}" >> "$GITHUB_OUTPUT"

      - name: Mark merged in PR-REGISTRO.md
        id: mark
        env:
          NUM: ${{ steps.num.outputs.num }}
        run: |
          if [ -n "${NUM}" ]; then
            if grep -qE "^\| ${NUM}  \|.*\| aberto \|" docs/PR-REGISTRO.md; then
              sed -Ei "/^\| ${NUM}  \|/ s/\| aberto \|/\| merged \|/" docs/PR-REGISTRO.md
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit, push and auto-merge registry PR
        if: steps.mark.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.num.outputs.num }}
          PRNR: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="auto/pr-registry/${PRNR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add docs/PR-REGISTRO.md
          git commit -m "${NUM}: chore: registrar merge do ${NUM} no PR-REGISTRO (automatico)"
          git push origin "${BRANCH}"
          URL=$(gh pr create --base main --head "${BRANCH}" \
            --title "${NUM}: chore: registrar merge do ${NUM} (automatico)" \
            --body "Atualizacao automatica do \`docs/PR-REGISTRO.md\` apos o merge do ${NUM}.")
          echo "criado: $URL"
          PR_AUTO=$(basename "$URL")
          gh pr merge "${PR_AUTO}" --auto --merge
services:
  openbao:
    image: openbao/openbao:latest
    container_name: careeros-openbao
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "root"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/openbao/data

  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: career_user
      POSTGRES_PASSWORD: career_password_dev_2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  openbao_data:
  postgres_data:
